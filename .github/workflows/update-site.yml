# Builds the plug-ins with Tycho and publishes the update site (p2 repository) on GitHub Pages.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
#
# Publishes only when a version tag is pushed (git tag v1.0.1, git push origin v1.0.1), or when started by hand
# from the Actions tab. For tags, also allow them once in Settings > Environments > github-pages >
# Deployment branches and tags: add a tag rule "v*".
name: Update site

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the Release for a tag
  pages: write
  id-token: write

# never run two deployments at once; let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Tycho
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Add the page shown in a browser
        run: cp io.github.jollygood1.webaddons.site/index.html io.github.jollygood1.webaddons.site/target/repository/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: io.github.jollygood1.webaddons.site/target/repository
      # for a version tag: also a Release with the update site as a zip (Install New Software > Add... > Archive...)
      - name: Create the Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="eclipse-web-addons-update-site-${GITHUB_REF_NAME}.zip"
          cp io.github.jollygood1.webaddons.site/target/*.zip "$zip"
          gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Install in Eclipse: Help > Install New Software, location https://jollygood1.github.io/eclipse-web-addons/ . The attached zip is the same update site for offline use (Add... > Archive...)."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
