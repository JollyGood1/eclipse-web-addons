# Builds the plug-ins with Tycho and publishes the update site (p2 repository) on GitHub Pages.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Update site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# never run two deployments at once; let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build with Tycho
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Add the page shown in a browser
        run: cp io.github.jollygood1.webaddons.site/index.html io.github.jollygood1.webaddons.site/target/repository/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: io.github.jollygood1.webaddons.site/target/repository

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
